<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="cheeseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="60%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#FF5100"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF7A00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Cheese Wedge Mascot Icon -->
  <g transform="translate(15, 12)" filter="url(#glow)">
    <!-- Main Cheese Triangle Wedge -->
    <path d="M 12 75 L 78 20 C 84 15, 92 18, 92 26 L 92 78 C 92 84, 86 88, 80 88 L 20 88 C 12 88, 8 81, 12 75 Z" fill="url(#cheeseGrad)" stroke="#FFE885" stroke-width="2.5"/>
    <!-- Cheese Holes -->
    <circle cx="48" cy="62" r="7.5" fill="#C44B00" fill-opacity="0.3"/>
    <circle cx="70" cy="42" r="5" fill="#C44B00" fill-opacity="0.3"/>
    <circle cx="75" cy="70" r="4" fill="#C44B00" fill-opacity="0.3"/>
    <circle cx="32" cy="76" r="3.5" fill="#C44B00" fill-opacity="0.3"/>
    <!-- Melting Drips underneath -->
    <path d="M 28 88 C 28 97, 34 97, 34 88 C 34 88, 46 88, 46 88 C 46 100, 53 100, 53 88 C 53 88, 67 88, 67 88 C 67 96, 73 96, 73 88" fill="url(#cheeseGrad)"/>
    <!-- Cute smile & eye -->
    <circle cx="56" cy="50" r="2.5" fill="#3D1800"/>
    <path d="M 52 56 Q 57 60 62 56" stroke="#3D1800" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography: Easy Cheesy -->
  <g transform="translate(120, 0)">
    <!-- Word EASY -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFB800" letter-spacing="-1">
      EASY
    </text>

    <!-- Word CHEESY -->
    <text x="122" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FF5500" letter-spacing="-1">
      CHEESY
    </text>

    <!-- Tagline: LOVE AT FIRST BITE -->
    <rect x="0" y="65" width="220" height="22" rx="11" fill="#FF5500" fill-opacity="0.15" stroke="#FF7A00" stroke-opacity="0.4" stroke-width="1"/>
    <text x="110" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFB800" letter-spacing="2">
      LOVE AT FIRST BITE
    </text>
    
    <!-- Subtitle: KASUR -->
    <text x="0" y="105" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#A3A3A3" letter-spacing="1">
      FAST FOOD RESTAURANT • KASUR
    </text>
  </g>
</svg>
