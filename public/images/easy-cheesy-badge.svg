<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="badgeBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF9E00"/>
      <stop offset="60%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>
    <linearGradient id="wedgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="80" cy="80" r="76" fill="url(#badgeBg)" stroke="#FFE082" stroke-width="3" filter="url(#badgeShadow)"/>
  <circle cx="80" cy="80" r="69" fill="none" stroke="#FFA726" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Cheese Wedge in Center -->
  <g transform="translate(42, 28)">
    <path d="M 6 56 L 68 12 C 73 8, 80 11, 80 18 L 80 60 C 80 64, 76 68, 70 68 L 14 68 C 7 68, 4 62, 6 56 Z" fill="url(#wedgeGrad)" stroke="#FFF" stroke-width="2"/>
    <circle cx="36" cy="46" r="6.5" fill="#C44B00" fill-opacity="0.25"/>
    <circle cx="56" cy="30" r="4.5" fill="#C44B00" fill-opacity="0.25"/>
    <circle cx="62" cy="52" r="3.5" fill="#C44B00" fill-opacity="0.25"/>
    <!-- Drips -->
    <path d="M 20 68 C 20 75, 26 75, 26 68 C 26 68, 38 68, 38 68 C 38 78, 44 78, 44 68 C 44 68, 58 68, 58 68 C 58 74, 63 74, 63 68" fill="url(#wedgeGrad)"/>
  </g>

  <!-- Text: EASY CHEESY -->
  <text x="80" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" letter-spacing="1">
    EASY CHEESY
  </text>
  <text x="80" y="134" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" fill="#FFE082" letter-spacing="2">
    KASUR
  </text>
</svg>
